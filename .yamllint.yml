extends: default

rules:
  # Workflow files legitimately use `on:`, which yamllint would otherwise
  # flag as the boolean `on`.
  truthy:
    check-keys: false
  # These files use flow mappings (`{ python-version: "3.14" }`) for brevity
  # and embed long shell/GraphQL snippets in block scalars.
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  line-length: disable
  document-start: disable
  comments:
    min-spaces-from-content: 1

ignore: |
  .git/
